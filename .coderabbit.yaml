language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"

  path_filters:
    - "**/*.py"
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.jsx"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/*.min.js"

  path_instructions:
    - path: "**/*.py"
      instructions: >
        Focus on security vulnerabilities (injection, unsafe deserialization,
        hardcoded secrets, unsafe eval/exec), logic bugs, unhandled exceptions,
        and violations of type hints. Flag any missing input validation on
        API endpoints.
    - path: "**/*.{ts,tsx,js,jsx}"
      instructions: >
        Focus on security vulnerabilities (XSS, unsafe innerHTML, exposed
        secrets/API keys, insecure API calls), logic bugs, unhandled promise
        rejections, and React anti-patterns (missing dependency arrays,
        unsafe state mutations).

  tools:
    ruff:
      enabled: true
    eslint:
      enabled: true
    gitleaks:
      enabled: true
    semgrep:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: "auto"