[pytest]
# Async Development Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring full stack (skip in partial dev)
    requires_dev1: marks tests that need Backend Lead work (FastAPI Gateway)
    requires_dev2: marks tests that need DB Engineer work (PostgreSQL, Neo4j)
    requires_dev3: marks tests that need AI/Search work (Qdrant, spaCy)
    requires_dev4: marks tests that need Full-Stack work (API integration)
    requires_dev5: marks tests that need Frontend work (React, Node)
    optional: marks tests that are nice-to-have but not blocking
    wip: marks Work-In-Progress features (allow failure without blocking)
    backend_ready: backend component exists and stable
    frontend_ready: frontend component exists and stable
    db_ready: database component exists and stable
    search_ready: search component exists and stable

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode for FastAPI tests
asyncio_mode = auto

# Timeout for hanging tests
timeout = 300

# Show extra summary info
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
