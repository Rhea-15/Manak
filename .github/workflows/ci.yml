name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  python-tests:
    name: Python Lint + Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PyTorch (CPU) & Dependencies
        run: |
          python -m pip install --upgrade pip
          # Force CPU version of PyTorch to prevent CI memory timeouts
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          if [ -f requirements.txt ]; then pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest ruff
          # Download required spaCy NLP model
          python -m spacy download en_core_web_sm

      - name: Lint with ruff
        run: ruff check . --output-format=github

      - name: Run pytest
        env:
          PYTHONPATH: .
        run: pytest tests/ -v --tb=short

  frontend-checks:
    name: JS/TS Lint + Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for package.json
        id: check_frontend
        run: |
          if find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.check_frontend.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install & Lint
        if: steps.check_frontend.outputs.found == 'true'
        run: |
          npm ci --prefer-offline --no-audit || npm install
          npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings=0 || true